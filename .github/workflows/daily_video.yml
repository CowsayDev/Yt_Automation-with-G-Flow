
name: ASURA Engine - Daily Episode

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: write

concurrency:
  group: asura-daily-episode
  cancel-in-progress: false

jobs:
  create-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: extracted/asura_engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate episode with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORY_MODEL: ${{ vars.STORY_MODEL }}
        run: python main.py

      - name: Save story memory and episodes
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/asura_engine/AI_BRAIN
          git add extracted/asura_engine/episodes
          git add extracted/asura_engine/prompts
          git add extracted/asura_engine/logs
          git diff --cached --quiet || (
            git commit -m "Generate next ASURA episode" &&
            git push
          )
