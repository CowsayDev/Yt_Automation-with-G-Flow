
name: Import ASURA Engine ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ASURA Engine
        run: |
          set -e

          ZIP="asura_engine_starter-1.zip"
          test -f "$ZIP"

          mkdir -p /tmp/asura-import
          unzip -q "$ZIP" -d /tmp/asura-import

          test -f /tmp/asura-import/main.py

          cp -a /tmp/asura-import/. .

          rm -f "$ZIP"

          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Import ASURA Engine project"
            git push
          else
            echo "No changes to commit"
          fi
