- name: Extract ASURA Engine
  run: |
    set -e
    echo "Listing files..."
    ls -la
    
    # ZIP ka naam auto-detect karega
    ZIP=$(ls -1 *.zip | head -n 1)
    echo "Found ZIP: $ZIP"
    
    rm -rf /tmp/asura-import
    mkdir -p /tmp/asura-import
    unzip -q "$ZIP" -d /tmp/asura-import
    
    echo "Inside ZIP:"
    ls -la /tmp/asura-import
    
    # Agar ZIP ke andar ek folder hai to usko handle kare
    if [ ! -f /tmp/asura-import/main.py ]; then
      echo "main.py root me nahi, subfolder check kar rahe..."
      SUB=$(find /tmp/asura-import -name "main.py" -printf "%h" -quit)
      if [ -n "$SUB" ]; then
        cp -a $SUB/. .
      else
        echo "ERROR: main.py kahin bhi nahi mila"
        exit 1
      fi
    else
      cp -a /tmp/asura-import/. .
    fi
    
    rm -rf "$ZIP" /tmp/asura-import
    find . -type d -name "__pycache__" -prune -exec rm -rf {} +
    echo "Extract done!"
