name: ASURA Engine - Daily Episode

on:
  workflow_dispatch:
  schedule:
    # 12:00 PM India time = 06:30 UTC
    - cron: "30 6 * * *"

permissions:
  contents: write

concurrency:
  group: asura-daily-episode
  cancel-in-progress: false

jobs:
  create-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: extracted/asura_engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: extracted/asura_engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate next episode with Gemini (retry + fallback)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORY_MODEL: ${{ secrets.STORY_MODEL }}
          GEMINI_FALLBACK_MODELS: gemini-3.8-flash,gemini-3.5-flash-lite
          MAX_RETRIES_PER_MODEL: "2"
          BASE_RETRY_SECONDS: "3"
          MAX_RETRY_SECONDS: "30"
        run: python main.py

      - name: Save story memory, episode and prompts
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/asura_engine/AI_BRAIN extracted/asura_engine/episodes extracted/asura_engine/prompts extracted/asura_engine/logs
          if ! git diff --cached --quiet; then
            git commit -m "Generate next ASURA episode"
            git push
          else
            echo "No generated changes to commit"
          fi

      - name: Upload episode artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asura-episode-${{ github.run_number }}
          path: |
            extracted/asura_engine/episodes/
            extracted/asura_engine/prompts/
            extracted/asura_engine/logs/
          if-no-files-found: ignore
          retention-days: 14
