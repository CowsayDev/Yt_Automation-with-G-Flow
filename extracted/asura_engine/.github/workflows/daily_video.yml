name: ASURA Engine - Daily Episode

on:
  workflow_dispatch:
  schedule:
    # 12:00 PM India time = 06:30 UTC
    - cron: "30 6 * * *"

permissions:
  contents: write

concurrency:
  group: asura-daily-episode
  cancel-in-progress: false

jobs:
  create-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate next episode with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORY_MODEL: ${{ vars.STORY_MODEL }}
        run: python main.py

      - name: Save story memory and episode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_BRAIN episodes prompts
          git diff --cached --quiet || git commit -m "Add next ASURA episode"
          git push

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asura-episode-${{ github.run_number }}
          path: |
            episodes/
            prompts/
            logs/
          if-no-files-found: ignore
          retention-days: 14
